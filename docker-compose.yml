version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_MODE=local
      - PYTHONPATH=/app
    working_dir: /app
    volumes:
      - ./:/app:cached
      - ./data/processed:/app/data/processed:cached
    depends_on:
      - qdrant
    restart: unless-stopped

volumes:
  qdrant_storage:
