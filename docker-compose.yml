services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped
    # healthcheck removed because the qdrant image in this environment
    # does not include 'curl' and the exec fails; rely on container logs
    # or external checks instead.

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_MODE=local
      - PYTHONPATH=/app
      - HF_HOME=/cache/huggingface
      - TRANSFORMERS_CACHE=/cache/huggingface
      # Optional: set a Groq API key to enable generator functionality.
      # You can set GROQ_API_KEY in the .env file or here. If not set,
      # the app will fall back to a dummy generator.
      - GROQ_API_KEY
      - GROQ_API_URL
    working_dir: /app
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    volumes:
      - type: bind
        source: .
        target: /app
        consistency: cached
      - type: bind
        source: ./data/processed
        target: /app/data/processed
        consistency: cached
      - /home/anantha/.cache/huggingface:/cache/huggingface:z
    depends_on:
      - qdrant
    restart: unless-stopped

volumes:
  qdrant_storage:
